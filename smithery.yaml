# Smithery.ai configuration
startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    {
      "type": "object",
      "properties": {
          "accessToken": {
              "type": "string",
              "description": "Apifox Access Token"
          },
          "projectId": {
              "type": "integer",
              "description": "Apifox Project ID"
          },
          "toolPrefix": {
              "type": "string",
              "description": "Optional stable tool name prefix (for auto approval allowlists)"
          }
      },
      "required": [
          "accessToken",
          "projectId"
      ]
    }
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({
      "command": "node",
      "args": [
        "dist/index.js",
        "--project-id",
        config.projectId,
        ...(config.toolPrefix ? ["--tool-prefix", config.toolPrefix] : [])
      ],
      "env": {
        "APIFOX_ACCESS_TOKEN": config.accessToken
      }
    })
